[package]
name = "accumulator"
version = "0.1.0"
edition = "2021"
description = "Accumulator — isolated lend/borrow markets on X1"

[lib]
crate-type = ["cdylib", "lib"]
name = "accumulator"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []
# Point at XDEX's testnet program. Never deploy a testnet build to mainnet.
testnet = []

[dependencies]
anchor-lang = { version = "=0.31.0" }
anchor-spl = { version = "=0.31.0" }

[lints.rust]
# Anchor's macros reference these cfgs; declare them so builds stay quiet.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-idl", "no-log-ix-name"))', 'cfg(target_os, values("solana"))'] }
