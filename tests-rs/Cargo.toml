# Integration tests: run the compiled program (target/deploy/accumulator.so) in LiteSVM.
# Separate workspace so its native-only deps never touch the on-chain build.
[package]
name = "accumulator-tests"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
litesvm = "=0.7.0"
accumulator = { path = "../programs/accumulator", features = ["no-entrypoint"] }
anchor-lang = "=0.31.0"
anchor-spl = "=0.31.0"
solana-sdk = "2.3"
serde_json = "1"
base64 = "0.22"
